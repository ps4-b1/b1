<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Exploit Host - Poops Chain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-logo">PS4</div>
            <div class="brand-text">
                <span class="brand-name">Exploit Host</span>
                <span class="brand-sub">WebKit Jailbreak</span>
            </div>
        </div>
        <div class="badge">Poops Chain</div>
    </header>

    <main class="wrap">
        <section class="hero">
            <h1 class="hero-title">Poops <span class="accent">Exploit</span></h1>
            <p class="hero-sub">Firmware 12.50 - 13.00</p>
        </section>

        <section class="status-panel">
            <span id="state" class="status-text loading">⏳ Please wait...</span>
            <br>
            <button id="retry" class="btn hidden" type="button">↻ Retry</button>
        </section>

        <!-- السجل مخفي -->
        <div id="out" style="display:none;"></div>
    </main>

    <footer class="foot">
        <p>❤️ Special thanks to all scene developers</p>
    </footer>
</div>

<script type="module">
    // ننتظر حتى يصبح الكاش جاهزاً (مثبت أو محدث) قبل تشغيل السلسلة،
    // حتى تكون chain_poops.js وكل تبعياتها مضمونة من الكاش دون اتصال.
    var started = false;

    function boot() {
        if (started) return;
        started = true;
        import("./chain_poops.js").catch(function(e) {
            var stateEl = document.getElementById("state");
            stateEl.innerHTML = "❌ Failed: "
                + (e && e.message ? e.message : e);
            stateEl.className = "status-text error";
            var btn = document.getElementById("retry");
            if (btn) btn.className = "btn";
        });
    }

    // مهلة استقرار قصيرة قبل بدء السلسلة: تمنع المنافسة مع أعمال WebKit
    // المعلّقة، وهو سبب شائع للتحمد في المحاولة الأولى بعد تشغيل الكاش
    function bootSettled() { setTimeout(boot, 1200); }

    var appCache = window.applicationCache;
    if (appCache) {
        appCache.addEventListener('cached', bootSettled, false);
        appCache.addEventListener('noupdate', bootSettled, false);
        appCache.addEventListener('error', bootSettled, false);
        appCache.addEventListener('obsolete', bootSettled, false);
        // شبكة أمان: إن علّق الكاش، نبدأ بعد 6 ثوانٍ مهما كان
        setTimeout(bootSettled, 6000);
    } else {
        bootSettled();
    }

    document.getElementById("retry").addEventListener("click", function() {
        location.reload();
    }, false);

    // إظهار أي خطأ عام بدلاً من شاشة صامتة
    window.addEventListener("error", function(e) {
        var stateEl = document.getElementById("state");
        if (stateEl && stateEl.textContent === "⏳ Please wait...") {
            stateEl.innerHTML = "❌ " + (e && e.message ? e.message : "Script error");
            stateEl.className = "status-text error";
        }
    }, false);
</script>
</body>
</html>
